<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipes</title>
  <meta name="theme-color" content="#c4502a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png?v=2" sizes="192x192" type="image/png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header id="app-header">
    <button id="back-btn" class="icon-btn invisible" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="app-title">Recipes</h1>
    <div class="header-actions">
      <button id="add-btn" class="icon-btn" aria-label="Add recipe" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="cook-btn" class="icon-btn invisible" aria-label="Cook mode">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 2v6m0-6h12v6M4 8h16l-1 13H5L4 8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="app-main">
    <section id="list-view">
      <section id="add-panel" hidden>
        <form id="sign-in-form">
          <h2>Add a recipe</h2>
          <input id="sign-in-email" type="email" autocomplete="username" placeholder="Email" required>
          <input id="sign-in-password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button type="submit">Sign in</button>
        </form>
        <div id="request-area" hidden>
          <div class="request-account"><span id="request-email"></span><button id="sign-out-btn" type="button">Sign out</button></div>
          <form id="recipe-request-form">
            <input id="request-url" type="url" inputmode="url" autocomplete="url" placeholder="Paste recipe, Instagram or YouTube URL" maxlength="2000" required>
            <textarea id="request-note" placeholder="Note (optional)" maxlength="2000" rows="2"></textarea>
            <button type="submit">Add recipe</button>
          </form>
          <div id="request-history"></div>
        </div>
        <p id="request-error" role="status" hidden></p>
      </section>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Find a recipe…" aria-label="Search recipes" autocomplete="off" autocorrect="off" autocapitalize="off">
      </div>
      <div id="tag-filter" class="tag-row" role="tablist"></div>
      <div id="recipe-grid" class="grid" aria-live="polite"></div>
      <p id="empty-state" hidden>No recipes match.</p>
    </section>

    <article id="detail-view" hidden></article>
  </main>

  <script src="app.js?v=3" type="module"></script>
</body>
</html>
